<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibliography</title>
<meta name="description" content="A cross-book bibliography: every work cited in each book, the claims its endnotes make, the theories those claims form, and the works each theory rests on.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --rule:#d8dee5;
  --accent:#1f4e8c; --accent-soft:#e3ecf7; --flag:#9a5b00; --flag-soft:#fbf0dc;
  --bad:#a33a2b; --bad-soft:#f8e3df; --good:#2f6b3a; --good-soft:#e1f0e3;
  --b0:#1f4e8c; --b1:#a0522d; --b2:#2f6b3a; --b3:#6b3fa0; --b4:#8a6d00; --b5:#00707a;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --ink:#e4e9ef; --muted:#97a4b2; --rule:#2c3640;
  --accent:#8db6ea; --accent-soft:#1f2d3e; --flag:#e3b265; --flag-soft:#33291a;
  --bad:#f0a093; --bad-soft:#3a221e; --good:#93d19e; --good-soft:#1c3221;
  --b0:#8db6ea; --b1:#e6a07a; --b2:#93d19e; --b3:#c3a3ec; --b4:#e3c565; --b5:#7fd3db; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --ink:#e4e9ef; --muted:#97a4b2; --rule:#2c3640;
  --accent:#8db6ea; --accent-soft:#1f2d3e; --flag:#e3b265; --flag-soft:#33291a;
  --bad:#f0a093; --bad-soft:#3a221e; --good:#93d19e; --good-soft:#1c3221;
  --b0:#8db6ea; --b1:#e6a07a; --b2:#93d19e; --b3:#c3a3ec; --b4:#e3c565; --b5:#7fd3db; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
header h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,4.5vw,36px);line-height:1.15;margin:0;text-wrap:balance}
header p{color:var(--muted);margin:6px 0 0;max-width:70ch}
nav.tabs{display:flex;gap:2px;margin:18px 0 0;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.lede{color:var(--muted);margin:14px 0 4px;max-width:72ch}
.tally{display:flex;flex-wrap:wrap;gap:6px 22px;margin:14px 0 0;padding:12px 0;border-bottom:1px solid var(--rule);font-size:14px}
.tally b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;margin-right:5px}
.tally a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:grid;grid-template-columns:minmax(200px,1fr) auto auto auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--rule)}
input,select,button{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;min-width:0}
select:disabled{opacity:.5}
#book{max-width:240px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:500}
button:hover{filter:brightness(1.08)}
button.quiet{background:var(--surface);color:var(--ink);border-color:var(--rule);font-weight:400}
.row2{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.chip{border:1px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;font-weight:400}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip[hidden]{display:none}
.status{color:var(--muted);font-size:13px;margin:10px 0 4px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.letters{display:flex;flex-wrap:wrap;gap:2px;font-family:var(--mono);font-size:12px}
.letters a{color:var(--accent);text-decoration:none;padding:0 3px}
.letters span{color:var(--rule);padding:0 3px}
ol.list{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:3.2rem 1fr;gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--rule);scroll-margin-top:140px}
.entry:target,.entry.hit{background:var(--accent-soft);box-shadow:0 0 0 8px var(--accent-soft)}
.yr{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.body{min-width:0}
.cit{font-family:var(--serif);font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.cit .au{font-weight:600}
.cit .ti{font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12.5px;color:var(--muted);align-items:baseline}
.meta a{color:var(--accent);text-decoration:none}
.meta a:hover{text-decoration:underline}
.kind{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.notes{font-family:var(--mono);font-size:11.5px;color:var(--accent);word-spacing:-1px}
.notes .bk{color:var(--muted)}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:0 6px;font-weight:500;white-space:nowrap}
.badge.contested,.badge.failed-replication{background:var(--flag-soft);color:var(--flag)}
.badge.retracted{background:var(--bad-soft);color:var(--bad)}
.badge.replicated{background:var(--good-soft);color:var(--good)}
.badge.multi{background:var(--accent-soft);color:var(--accent)}
.badge.method{background:var(--surface);border:1px solid var(--rule);color:var(--muted)}
mark{background:var(--accent-soft);color:inherit;border-radius:2px}
.empty{padding:40px 0;color:var(--muted);text-align:center}
.loading{padding:40px 0;color:var(--muted);list-style:none}
details.uses{margin-top:6px}
details.uses summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none}
details.uses summary::before{content:"▸ ";font-size:11px}
details.uses[open] summary::before{content:"▾ "}
details.uses summary::-webkit-details-marker{display:none}
/* endnote claims, used across views */
ul.claimlist{list-style:none;margin:6px 0 0;padding:0}
.claim{padding:6px 0 6px 10px;border-left:3px solid var(--rule);margin:4px 0;font-size:14px}
.claim .loc{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:6px;white-space:nowrap}
.claim .loc i{font-style:normal;color:var(--bk,var(--accent))}
.claim .lk{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:4px}
.claim .by{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.claim .by a{color:var(--accent);text-decoration:none}
.claim .by a:hover{text-decoration:underline}
.link{font-size:11.5px;border:1px solid var(--rule);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap;background:var(--surface)}
.link b{font-weight:600;color:var(--ink)}
.sg{font-family:var(--mono);font-weight:500}
.sg.p{color:var(--good)}.sg.m{color:var(--bad)}.sg.z{color:var(--muted)}.sg.h{color:var(--flag)}.sg.q{color:var(--muted)}
.bkdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bk,var(--accent));margin-right:4px;vertical-align:baseline}
/* panels and sections */
h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:30px 0 6px}
h3{font-size:15px;font-weight:600;margin:20px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px;max-width:72ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;text-decoration:none;color:inherit;display:block}
a.card:hover{border-color:var(--accent)}
.card h4{margin:0 0 4px;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.card .health{margin-top:8px;font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;color:var(--muted)}
.ok{color:var(--good)}.warn{color:var(--flag)}.no{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:6px;background:var(--accent-soft);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.step{display:grid;grid-template-columns:2rem 1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.step .n{font-family:var(--mono);color:var(--muted);font-size:13px;padding-top:2px}
.step .t{font-size:15px}
.step .s{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.step.broken .t{text-decoration:line-through;text-decoration-color:var(--bad)}
.step details{grid-column:2/-1}
.step details summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
.stress{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px;margin:10px 0}
.stress label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.stress input[type=number]{width:6em}
.verdict{font-weight:600}
svg.graph{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--rule);border-radius:8px;margin-top:8px}
svg.graph text{font-family:var(--sans);font-size:12px;fill:var(--ink)}
svg.graph .node rect{fill:var(--surface);stroke:var(--rule)}
svg.graph .edge{fill:none;stroke-width:1.6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:16px;height:3px;margin-right:5px;vertical-align:middle;background:var(--c)}
.item{padding:10px 0;border-bottom:1px solid var(--rule)}
.item > summary{cursor:pointer;list-style:none}
.item > summary::-webkit-details-marker{display:none}
.item .why{color:var(--muted);font-size:13px}
.pickers{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pickers .row{display:flex;flex-wrap:wrap;gap:5px;align-items:baseline}
.pickers .row > span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);width:5.5em}
.grid td.cell{text-align:center;cursor:pointer;font-family:var(--mono);font-size:12.5px;min-width:56px}
.grid td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.grid td.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.grid td.cell .dots{display:flex;gap:2px;justify-content:center;margin-top:2px}
.grid td.cell .dots i{display:block;height:3px;border-radius:2px;background:var(--bk)}
.grid th.g{writing-mode:initial;text-align:center;min-width:72px}
.grid td.c{white-space:nowrap}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--rule);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
footer a{color:var(--accent)}
footer .dl a{font-family:var(--mono);font-size:12px;margin-right:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px;z-index:20}
textarea{width:100%;height:160px;margin-top:8px;font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px}
@media (max-width:720px){
  .controls{grid-template-columns:1fr 1fr}
  .controls #q{grid-column:1/-1}
  #book{max-width:none}
  .row2 #copy{margin-left:0!important}
  .entry{grid-template-columns:1fr}
  .yr{padding-top:0}
  .step{grid-template-columns:1.6rem 1fr}
  .step .s{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Bibliography</h1>
  <p>Works cited across a growing set of books, what each endnote claims, the theories those claims add up to, and the works each theory rests on. Endnote tags read “Ch 4 n21” for chapter 4, note 21.</p>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
</header>
<main id="view"><p class="loading">Loading…</p></main>
<footer>
  <span class="dl">Data:
    <a href="data/works.json">works</a><a href="data/endnotes.json">endnotes</a><a href="data/theories.json">theories</a><a href="data/books.json">books</a><a href="data/bibliography.bib">BibTeX</a><a href="data/bibliography.csv">CSV</a>
  </span>
  <span id="gen"></span>
</footer>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
