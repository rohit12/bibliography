AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bibliography site: private S3 bucket behind CloudFront on a Route 53 subdomain,
  with HTTPS and a GitHub Actions role that can deploy (and nothing else).
  Deploy this stack in us-east-1 (CloudFront certificates must live there).

Parameters:
  DomainName:
    Type: String
    Description: Site address, e.g. bib.example.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone of the parent domain
  GitHubRepo:
    Type: String
    Description: >
      Repository allowed to deploy, as it appears in GitHub's OIDC subject claim:
      owner@OWNER_ID/name@REPO_ID, e.g. rohit12@6738641/bibliography@1432692455.
      The IDs come from the GitHub API (/repos/OWNER/NAME: owner.id and id).
    AllowedPattern: "[A-Za-z0-9_.-]+(@[0-9]+)?/[A-Za-z0-9_.-]+(@[0-9]+)?"
  CreateGitHubOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if this AWS account already has the GitHub OIDC provider

  BasicAuthHash:
    Type: String
    NoEcho: true
    Default: ""
    AllowedPattern: "^$|^[0-9a-f]{64}$"
    Description: >
      To require a login, the SHA-256 hex digest of base64("user:password"), e.g.
      printf %s "$(printf %s 'user:password' | base64)" | sha256sum. Leave empty for a public site.

Conditions:
  MakeOIDC: !Equals [!Ref CreateGitHubOIDCProvider, "true"]
  UseAuth: !Not [!Equals [!Ref BasicAuthHash, ""]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200   # includes India
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # Managed policies: CachingOptimized; CORS-With-Preflight-And-SecurityHeaders
          # (CORS so other sites and notebooks can fetch the JSON directly)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: eaab4381-ed33-4a86-88ca-d9558dc6cd63
          FunctionAssociations: !If
            - UseAuth
            - - EventType: viewer-request
                FunctionARN: !GetAtt AuthFunction.FunctionARN
            - !Ref AWS::NoValue
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # Checks a username and password on every request, before the cache, so no page
  # or data file is served without them. The browser asks once and remembers.
  AuthFunction:
    Type: AWS::CloudFront::Function
    Condition: UseAuth
    Properties:
      Name: !Sub "${AWS::StackName}-auth"
      AutoPublish: true
      FunctionConfig:
        Comment: Basic auth for the bibliography site
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var crypto = require('crypto');
        var EXPECTED = '${BasicAuthHash}';
        function handler(event) {
          var request = event.request;
          var header = request.headers.authorization;
          if (header && header.value.indexOf('Basic ') === 0) {
            var digest = crypto.createHash('sha256').update(header.value.slice(6)).digest('hex');
            if (digest === EXPECTED) {
              return request;
            }
          }
          return {
            statusCode: 401,
            statusDescription: 'Unauthorized',
            headers: {
              'www-authenticate': { value: 'Basic realm="Bibliography", charset="UTF-8"' },
              'cache-control': { value: 'no-store' }
            }
          };
        }

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  RecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # fixed zone id for all CloudFront distributions

  RecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets GitHub Actions on the main branch upload the site and refresh the CDN
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOIDC
                - !Ref GitHubOIDCProvider   # also makes the role wait for the provider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  SiteURL:
    Value: !Sub "https://${DomainName}"
  BucketName:
    Description: S3_BUCKET in the deploy workflow
    Value: !Ref Bucket
  DistributionId:
    Description: CLOUDFRONT_DISTRIBUTION_ID in the deploy workflow
    Value: !Ref Distribution
  DeployRoleArn:
    Description: AWS_ROLE_ARN in the deploy workflow
    Value: !GetAtt DeployRole.Arn
