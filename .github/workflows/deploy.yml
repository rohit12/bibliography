name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

# Outputs of the bibliography-site CloudFormation stack (infra/site.yml).
# Identifiers, not secrets: the role only trusts this repository's main branch.
env:
  AWS_ROLE_ARN: arn:aws:iam::496205974148:role/bibliography-site-DeployRole-SrA3qhR7iVrk
  S3_BUCKET: bibliography-site-bucket-chuvjciln0pr
  CLOUDFRONT_DISTRIBUTION_ID: E2389NX57URAPW

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job assume the AWS deploy role, no stored keys
    steps:
      - uses: actions/checkout@v4

      # This repository is public. private/ (personal notes and extensions)
      # is gitignored; stop if anything besides its README was ever committed.
      - name: Refuse if private data is tracked
        run: |
          tracked=$(git ls-files private | grep -v '^private/README.md$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Private files are committed to a public repository: $tracked"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Validate data
        run: python bib.py validate

      - name: Build public site
        run: python bib.py build

      - name: AWS credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload to S3 and refresh CloudFront
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          BUCKET: ${{ env.S3_BUCKET }}
          DIST: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          CC="public, max-age=300"
          aws s3 sync site "s3://$BUCKET" --delete --cache-control "$CC" \
            --exclude "*.bib" --exclude "*.csv" --exclude "*.json"
          aws s3 cp site/data "s3://$BUCKET/data" --recursive --exclude "*" --include "*.json" \
            --cache-control "$CC" --content-type "application/json; charset=utf-8"
          aws s3 cp site/data/bibliography.bib "s3://$BUCKET/data/bibliography.bib" \
            --cache-control "$CC" --content-type "text/plain; charset=utf-8"
          aws s3 cp site/data/bibliography.csv "s3://$BUCKET/data/bibliography.csv" \
            --cache-control "$CC" --content-type "text/csv; charset=utf-8"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*" \
            --query 'Invalidation.Id' --output text
